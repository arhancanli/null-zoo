name: Correction
description: A reported number, claim or citation you believe is wrong.
labels: [correction]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: Section, table, figure or sentence.
    validations: {required: true}
  - type: textarea
    id: problem
    attributes:
      label: What is wrong, and how you know
    validations: {required: true}
