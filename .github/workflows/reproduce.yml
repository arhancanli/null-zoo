name: reproduce

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Instrument tests
        run: npm test
      - name: Published run reproduces byte for byte
        run: npm run reproduce:v0
      - name: Committed tables and numbers match the result files
        run: |
          npm run tables
          git diff --exit-code -- paper/generated
